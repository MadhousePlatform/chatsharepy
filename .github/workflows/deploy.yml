name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    environment: CI
    env:
      PANEL_ORIGIN_URL: ${{ vars.PANEL_ORIGIN_URL }}
      PANEL_API_URL: ${{ vars.PANEL_API_URL }}
      PANEL_WSS_URL: ${{ vars.PANEL_WSS_URL }}
      WINGS_TOKEN: ${{ secrets.WINGS_TOKEN }}
      PANEL_APPLICATION_KEY: ${{ secrets.PANEL_APPLICATION_KEY }}
      PANEL_CLIENT_KEY: ${{ secrets.PANEL_CLIENT_KEY }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL: ${{ vars.DISCORD_CHANNEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          ./run.sh tests

      - name: Run linting
        run: |
          ./run.sh lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            APP_DIR=/srv/minecraft/chatsharepy
            PYTHON_BIN=/usr/bin/python3

            # Navigate to your app directory
            cd "$APP_DIR"

            # Stop the service if it's running
            sudo systemctl stop chatshare || pkill -f "python.*chatshare" || true

            # Backup current version
            cp -r . ../chatshare-backup-$(date +%Y%m%d-%H%M%S) || true

            # Pull latest code
            git fetch origin
            git reset --hard origin/main

            # Update dependencies
            "$PYTHON_BIN" -m pip install -r requirements.txt

            # Update environment file
            cat > .env << EOF
                  PANEL_ORIGIN_URL=${{ vars.PANEL_ORIGIN_URL }}
                  PANEL_API_URL=${{ vars.PANEL_API_URL }}
                  PANEL_WSS_URL=${{ vars.PANEL_WSS_URL }}
                  WINGS_TOKEN=${{ secrets.WINGS_TOKEN }}
                  PANEL_APPLICATION_KEY=${{ secrets.PANEL_APPLICATION_KEY }}
                  PANEL_CLIENT_KEY=${{ secrets.PANEL_CLIENT_KEY }}
                  DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
                  DISCORD_CHANNEL=${{ vars.DISCORD_CHANNEL }}
            EOF

            # Start the service
            sudo systemctl start chatshare
